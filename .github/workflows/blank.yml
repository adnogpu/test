name: Run Private Register (pull main repo)

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "并发 job 数量(每个 job 20 个账号: 2 进程 x 10)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "256"

permissions:
  contents: read

concurrency:
  group: txtestreg-public-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  MAIL_API: "https://mail.twcdk.com"

jobs:
  prep:
    name: Prepare matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Build job index list
        id: gen
        shell: bash
        run: |
          n=${{ inputs.jobs }}
          arr=$(seq 1 "$n" | jq -R -s -c 'split("\n") | map(select(length>0)) | map(tonumber)')
          echo "matrix=$arr" >> "$GITHUB_OUTPUT"
          echo "jobs to run: $arr"

  register:
    name: "register batch ${{ matrix.idx }}"
    runs-on: windows-latest
    needs: prep
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        idx: ${{ fromJSON(needs.prep.outputs.matrix) }}

    steps:
      # 从私有主仓库拉取代码(用仓库 Secret: MAIN_REPO_TOKEN)
      - name: Pull private main repo (adnogpu/txtestreg)
        uses: actions/checkout@v4
        with:
          repository: xbox-cn/txreg
          token: ${{ secrets.MAIN_REPO_TOKEN }}
          path: mainrepo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: mainrepo/requirements.txt

      - name: Install deps
        shell: pwsh
        working-directory: mainrepo
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install cloakbrowser (fresh, no cache)
        shell: pwsh
        run: |
          $root = Join-Path $env:USERPROFILE ".cloakbrowser"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          python -m cloakbrowser install

      - name: Resolve cloak chrome path
        shell: pwsh
        run: |
          $root = Join-Path $env:USERPROFILE ".cloakbrowser"
          if (-not (Test-Path $root)) { throw "cloak dir missing: $root" }
          $c = Get-ChildItem $root -Recurse -Filter chrome.exe -ErrorAction SilentlyContinue |
               Sort-Object FullName | Select-Object -Last 1
          if (-not $c) {
            Write-Host "=== .cloakbrowser 内容 ==="
            Get-ChildItem $root -Recurse -Depth 2 | Select-Object -First 30 FullName
            throw "cloak chrome.exe not found under $root"
          }
          if ($c.Length -lt 1MB) { throw "chrome.exe 过小/损坏: $($c.FullName) size=$($c.Length)" }
          echo "CHROME_EXE=$($c.FullName)" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          Write-Host "cloak chrome OK: $($c.FullName) size=$($c.Length)"

      - name: Cache CLIP model
        id: clip-model
        uses: actions/cache@v4
        with:
          path: mainrepo/clip-model
          key: clip-model-vit-b-p32-v1

      - name: Download CLIP model (first run only)
        if: steps.clip-model.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: mainrepo
        run: python -c "import clip_guess; clip_guess.ensure_model()"

      - name: Register accounts (2 workers x 10)
        shell: pwsh
        working-directory: mainrepo
        run: |
          python -u batch_register.py --count 10 --workers 2 --out accounts_${{ matrix.idx }}.jsonl

      - name: Collect keys
        if: always()
        shell: pwsh
        working-directory: mainrepo
        run: |
          if (Test-Path key.txt) {
            Copy-Item key.txt keys_job_${{ matrix.idx }}.txt -Force
          } else {
            New-Item -ItemType File keys_job_${{ matrix.idx }}.txt -Force | Out-Null
          }
          if (Test-Path accounts_${{ matrix.idx }}.jsonl) {
            Copy-Item accounts_${{ matrix.idx }}.jsonl accounts_job_${{ matrix.idx }}.jsonl -Force
          }

      - name: Upload per-job artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.idx }}
          path: |
            mainrepo/keys_job_${{ matrix.idx }}.txt
            mainrepo/accounts_job_${{ matrix.idx }}.jsonl
          if-no-files-found: ignore

  merge:
    name: Merge all keys
    runs-on: windows-latest
    needs: register
    if: always()
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: downloads
          pattern: result-*
          merge-multiple: true

      - name: Merge keys & accounts
        shell: pwsh
        run: |
          Get-ChildItem downloads -Filter "keys_job_*.txt" |
            ForEach-Object { Get-Content $_.FullName } |
            Where-Object { $_.Trim() -ne "" } |
            Set-Content keys-all.txt -Encoding ascii
          Get-ChildItem downloads -Filter "accounts_job_*.jsonl" |
            ForEach-Object { Get-Content $_.FullName } |
            Set-Content accounts-all.jsonl -Encoding utf8
          echo "total keys: $((Get-Content keys-all.txt | Measure-Object -Line).Lines)"

      - name: Upload merged keys
        uses: actions/upload-artifact@v4
        with:
          name: keys-all
          path: keys-all.txt

      - name: Upload merged accounts
        uses: actions/upload-artifact@v4
        with:
          name: accounts-all
          path: accounts-all.jsonl
